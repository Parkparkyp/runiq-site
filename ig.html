<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>예약신청 | 루닉필름</title>
<meta name="robots" content="noindex,nofollow"><!-- 광고용 안내 주소라 검색에는 나오지 않게 해요 -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="style.css?v=7"></head><body>
<div class="in c"><div class="sec page"><img src="assets/logo.png" alt="루닉필름" style="height:34px;width:auto;margin:0 auto 22px">
<p class="lead" id="msg">예약신청서로 이동하고 있어요…</p>
<div class="btns"><a class="go book hide" id="go" href="#">예약신청서 열기</a></div>
<div class="links"><a href="/">홈페이지 보기</a></div></div></div>
<script src="site.js?v=7"></script>
<script>
/* runiq.kr/ig  →  예약신청서로 연결하고 "인스타그램"을 미리 선택해 줘요 (광고용 주소) */
(function(){
  var B=window.SITE||{},KEY='rq_hp_cfg_v2',done=false;
  function ok(u){try{var x=new URL(u);return x.protocol==='https:'&&(x.hostname==='runiq.kr'||/\.runiq\.kr$/.test(x.hostname));}catch(e){return false;}}
  function go(u){
    if(done)return;
    if(!ok(u)){return;}
    done=true;var x=new URL(u);x.searchParams.set('src','ig');
    var a=document.getElementById('go');a.href=x.href;a.classList.remove('hide');
    location.replace(x.href);
  }
  function fail(){if(done)return;document.getElementById('msg').textContent='예약신청서 주소를 불러오지 못했어요. 홈페이지에서 예약신청을 눌러 주세요.';}
  var cached=null;try{var c=JSON.parse(localStorage.getItem(KEY)||'null');if(c&&c.cfg&&Date.now()-c.t<6*10*60*1000)cached=c.cfg;}catch(e){}
  if(cached&&cached.links&&cached.links.book&&ok(cached.links.book)){go(cached.links.book);return;}
  var fb=ok(B.book)?B.book:'';
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(B.api||'')){if(fb)go(fb);else fail();return;}
  var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},3500);
  fetch(B.api+'?a=cfg',{signal:ctl?ctl.signal:undefined}).then(function(r){return r.json();}).then(function(j){
    clearTimeout(tm);
    if(j&&j.ok){try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),cfg:j}));}catch(e){}}
    var u=(j&&j.links&&j.links.book)||fb;if(u&&ok(u))go(u);else fail();
  }).catch(function(){clearTimeout(tm);if(fb)go(fb);else fail();});
})();
</script></body></html>
